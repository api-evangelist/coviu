name: Coviu
kind: company
description: >-
  Coviu is an Australian telehealth company, headquartered in Sydney and spun out of
  CSIRO's Data61, that provides a purpose-built video consultation platform for healthcare
  providers, allied health, and enterprise clinical networks. Its browser-based, WebRTC
  video calling supports virtual care workflows including waiting rooms, in-call clinical
  tools, screen and file sharing, medical device integrations, and payments. For developers,
  Coviu ships a secure OAuth2-protected REST API (base https://api.coviu.com) that lets
  applications create and manage video consultation Sessions and Participants, monitor
  Waiting Area queues in real time, retrieve Collections (submissions, files, and audio
  recordings), and receive event Webhooks, plus an in-call Plugin API and embedded iframe
  mode. Coviu is a telehealth video/interoperability layer rather than an EHR or FHIR data
  platform, so its documented public surface is REST + webhooks, not HL7 FHIR.
